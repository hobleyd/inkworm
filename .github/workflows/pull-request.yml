name: inkworm-pull-request

on:
  pull_request:
    branches:
      - main

# A newer push to the same PR supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependabot PRs run with a read-only token and no secrets; nothing here needs
# either.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: false

      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
